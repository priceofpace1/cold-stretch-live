name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Model (JavaScript) against the recorder's arithmetic
        run: node --test tests/model.test.mjs tests/espn.test.mjs tests/tokens.test.mjs tests/release.test.mjs tests/site.test.mjs tests/words.test.mjs tests/coinbase.test.mjs
      - name: Recorder (Python)
        run: python3 -m unittest discover -s tests -v
